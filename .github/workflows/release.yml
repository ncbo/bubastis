name: Release

# Publishing a GitHub release tagged vX.Y.Z builds bubastis-X.Y.Z.jar,
# smoke-tests it and attaches it to the release.
on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the jar to the release
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: vars
        run: |
          TAG_NAME=${GITHUB_REF##*/}
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid tag format: $TAG_NAME (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build jar
        run: mvn -B clean package -DskipTests -Drevision=${{ steps.vars.outputs.version }}

      - name: Smoke test the jar
        run: script/smoke-test target/bubastis-${{ steps.vars.outputs.version }}.jar

      - name: Attach the jar to the release
        uses: softprops/action-gh-release@v2
        with:
          files: target/bubastis-${{ steps.vars.outputs.version }}.jar
          generate_release_notes: true
